[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q --tb=short
markers =
    functional: End-to-end and functional claim pipeline tests
    integration: Integration and multi-step workflow tests
    boundary: Edge case and temporal boundary tests
    negative: Negative testing with invalid inputs and errors
    security: Security, auth bypass, and SQL injection tests
    database: SQLAlchemy model, constraint, and relation tests
    ocr: Optical character recognition parsing and confidence tests
    rule_engine: Deterministic policy rule engine tests
    contradictions: Logical contradiction and cross-field integrity tests
    documents: Document upload and missing document checks
    duplicates: Duplicate detection and collision tests
    serials: Serial number and IMEI verification tests
    confidence: Confidence threshold and model disagreement tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*StarletteDeprecationWarning.*:
    ignore:.*PydanticDeprecatedSince20.*:
